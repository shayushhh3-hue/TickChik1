name: סוף חודש ודוח חודשי (ה-1 בחודש 08:50)
on:
  schedule:
    - cron: "50 5,6 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "להריץ עכשיו גם מחוץ לשעה הקבועה"
        type: boolean
        default: true
concurrency:
  group: monthly
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
      BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_UID: ${{ secrets.OWNER_UID }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SITE_URL: ${{ secrets.SITE_URL }}
      FORCE: ${{ inputs.force == true && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Chromium for the headless page
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: python3 tools/build.py page/live.html
      - run: node jobs/monthly.js
      - run: node jobs/report.js month
