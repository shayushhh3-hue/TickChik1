<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>תיק צ׳יק – אימות דו-שלבי</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light}
body{margin:0;background:#f3f5f8;color:#1e293b;font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6}
main{max-width:600px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;color:#1e344e;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:16px 0}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:#45566b;margin:10px 0 3px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;min-height:42px}
input.code{direction:ltr;text-align:left;letter-spacing:.12em;max-width:220px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 14px;min-height:40px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:#1e293b;text-decoration:none}
.btn.pri{background:#1e344e;color:#fff;border-color:#1e344e}
.btn.danger{color:#b42318;border-color:#f3c3be}
.muted{color:#64748b;font-size:13.5px}
.err{color:#b91c1c;font-size:13.5px;min-height:1em;margin:8px 0 0}
.ok{color:#15803d;font-weight:600}
ol{padding-inline-start:20px;margin:6px 0} ol li{margin:6px 0}
.key{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;letter-spacing:.08em;background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:9px;padding:6px 12px;display:inline-block;word-break:break-all}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0;padding:0;list-style:none}
.codes li{direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="top"><h1>אימות דו-שלבי</h1><a class="btn" href="./">חזרה לתיק ›</a></div>
<p class="muted">בכל כניסה, אחרי הסיסמה, מקלידים גם קוד של 6 ספרות מאפליקציה בטלפון. כך גם מי שיודע את הסיסמה שלך לא יכול להיכנס בלי הטלפון.</p>
<div class="card" id="box"><p class="muted">טוען…</p></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function call(method,url,body){const r=await fetch('/api'+url,{method,credentials:'same-origin',headers:{'x-tc':'1',...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){if(r.status===401&&url==='/2fa'){location.href='./';return}throw new Error((j&&j.error&&j.error.message)||('HTTP '+r.status))} return j}
const codesH=c=>`<ul class="codes">${c.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted">כל קוד עובד פעם אחת. שמור אותם במקום בטוח (צילום מסך, מנהל סיסמאות): אם הטלפון יאבד, הם הדרך להיכנס. הם מוצגים רק עכשיו.</p>`;
async function load(){
  let s; try{s=await call('GET','/2fa')}catch(e){$('box').innerHTML=`<p class="err">${esc(e.message)}</p>`;return} if(!s)return;
  if(s.on){$('box').innerHTML=`<h2><span class="ok">✓ פועל</span></h2><p style="margin:0">בכל כניסה תתבקש לקוד מאפליקציית האימות. נשארו ${s.backupLeft} קודי גיבוי.</p>
      ${s.override?'<p class="err">שים לב: בשרת מוגדר TWOFA_OFF=1, ולכן כרגע הכניסה לא מבקשת קוד. כדאי להסיר אותו ב-Railway.</p>':''}
      <label for="cd">קוד מהאפליקציה</label><input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="11">
      <div class="row"><button class="btn" type="button" id="newb">קודי גיבוי חדשים</button></div><div id="nb"></div>
      <h2 style="margin-top:18px">לכבות</h2><label for="pw">הסיסמה שלך</label><input id="pw" type="password" autocomplete="current-password">
      <div class="row"><button class="btn danger" type="button" id="off">לכבות את האימות הדו-שלבי</button></div><p class="err" id="er" role="alert"></p>`;
    $('newb').onclick=async()=>{$('er').textContent=''; try{const r=await call('POST','/2fa/backup',{code:$('cd').value}); $('nb').innerHTML=codesH(r.codes)}catch(e){$('er').textContent=e.message}};
    $('off').onclick=async()=>{$('er').textContent=''; try{await call('POST','/2fa/disable',{password:$('pw').value,code:$('cd').value}); load()}catch(e){$('er').textContent=e.message}};
    return}
  $('box').innerHTML=`<h2>כבוי</h2><p style="margin:0">צריך אפליקציית אימות בטלפון, למשל Google Authenticator או Microsoft Authenticator (חינם בחנות האפליקציות).</p>
    <div class="row"><button class="btn pri" type="button" id="st">להפעיל</button></div><p class="err" id="er" role="alert"></p>`;
  $('st').onclick=async()=>{$('er').textContent=''; let r; try{r=await call('POST','/2fa/setup',{})}catch(e){$('er').textContent=e.message;return}
    const key=r.secret.replace(/(.{4})/g,'$1 ').trim();
    $('box').innerHTML=`<h2>הפעלה</h2><ol><li>בטלפון: <a class="btn" href="${esc(r.uri)}">להוסיף לאפליקציית האימות</a><div class="muted">אם הכפתור לא פותח את האפליקציה (או שאתה במחשב), פתח את האפליקציה, בחר "הוספת חשבון" ← "הזנת מפתח", והקלד:</div><div class="key" id="key">${esc(key)}</div></li>
      <li>האפליקציה מראה עכשיו קוד של 6 ספרות בשם "תיק צ׳יק". הקלד אותו כאן:<input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></li></ol>
      <div class="row"><button class="btn pri" type="button" id="en">להפעיל</button><button class="btn" type="button" id="cx">ביטול</button></div><p class="err" id="er" role="alert"></p>`;
    $('cx').onclick=load;
    $('en').onclick=async()=>{$('er').textContent=''; try{const x=await call('POST','/2fa/enable',{code:$('cd').value});
      $('box').innerHTML=`<h2><span class="ok">✓ האימות הדו-שלבי פועל</span></h2><p style="margin:0">מהכניסה הבאה תתבקש גם לקוד מהאפליקציה. חיבורים אחרים לחשבון (מכשירים אחרים) נותקו.</p><h2 style="margin-top:14px">קודי גיבוי</h2>${codesH(x.codes)}<div class="row"><a class="btn pri" href="./">חזרה לתיק</a></div>`}
      catch(e){$('er').textContent=e.message}}};
}
load();
</script>
</body>
</html>
