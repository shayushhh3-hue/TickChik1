<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>תיק צ׳יק – ייבוא נתונים</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light}
body{margin:0;background:#f3f5f8;color:#1e293b;font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:24px;color:#1e344e;margin:0 0 4px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:16px 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;color:#1e293b;text-decoration:none}
.btn.pri{background:#1e344e;color:#fff;border-color:#1e344e}.btn:disabled{opacity:.55;cursor:default}
.muted{color:#64748b;font-size:13.5px}.err{color:#b91c1c}.ok{color:#15803d}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:start}th{color:#475569;font-weight:600}
code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#f1f5f9;padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<main>
<h1>ייבוא נתונים</h1>
<p class="muted">פעם אחת, במעבר מהגרסה הקודמת, או לשחזור מגיבוי: בוחרים קובץ JSON (<code>{docs: {נתיב: מסמך}}</code>) והנתונים נכתבים לאתר. כל משתמש משחזר רק את הנתונים של עצמו. מסמך קיים באותו נתיב מוחלף.</p>
<div class="card">
  <p><input type="file" id="file"></p>
  <div id="summary"></div>
  <p><button class="btn pri" type="button" id="go" disabled>ייבוא</button> <a class="btn" href="./">חזרה לתיק ›</a></p>
  <p id="log" class="muted"></p>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DOCS=null;
let ME=null; fetch('/api/me',{credentials:'same-origin'}).then(r=>r.json()).then(j=>{ME=j.me; if(!j.me){document.querySelector('.card').innerHTML='<p class="err">צריך להיכנס קודם. <a href="./">לכניסה</a></p>'}});
$('file').addEventListener('change',async()=>{
  const f=$('file').files[0]; DOCS=null; $('go').disabled=true; $('summary').textContent=''; if(!f)return;
  try{const j=JSON.parse(await f.text()); const docs=j.docs||j; if(!docs||typeof docs!=='object')throw new Error('לא נמצאו מסמכים בקובץ');
    DOCS=Object.fromEntries(Object.entries(docs).filter(([p,d])=>d&&typeof d==='object'&&p.split('/').length%2===0&&(ME&&ME.owner?!p.startsWith('data/users/'):(p.startsWith('data/users/'+(ME&&ME.id)+'/')||p==='watch/'+(ME&&ME.id)))));
    const by={}; for(const p of Object.keys(DOCS)){const c=p.split('/')[0];by[c]=(by[c]||0)+1}
    $('summary').innerHTML='<table><tr><th>אוסף</th><th>מסמכים</th></tr>'+Object.entries(by).map(([c,n])=>`<tr><td><code>${esc(c)}</code></td><td>${n}</td></tr>`).join('')+'</table>'+(j.exportedAt?'<p class="muted">יוצא ב-'+esc(j.exportedAt)+'</p>':'');
    $('go').disabled=!Object.keys(DOCS).length;
  }catch(e){$('summary').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
});
$('go').addEventListener('click',async()=>{
  if(!DOCS)return; $('go').disabled=true; $('log').textContent='מייבא…';
  const keys=Object.keys(DOCS); let done=0, errs=[];
  // parts of up to ~6MB each (the chart documents are large)
  const parts=[]; let cur={}, size=0; for(const k of keys){const n=JSON.stringify(DOCS[k]).length; if(size+n>6e6&&Object.keys(cur).length){parts.push(cur);cur={};size=0} cur[k]=DOCS[k]; size+=n} if(Object.keys(cur).length)parts.push(cur);
  for(const part of parts){
    try{const r=await fetch('/api/db/import',{method:'POST',credentials:'same-origin',headers:{'x-tc':'1','content-type':'application/json'},body:JSON.stringify({docs:part})}); const j=await r.json(); if(!r.ok)throw new Error((j.error&&j.error.message)||r.status); done+=j.n}
    catch(e){errs.push(e.message)} $('log').textContent=`${done} מתוך ${keys.length}`}
  $('log').innerHTML=errs.length?'<span class="err">חלק לא נכתב: '+esc(errs.slice(0,3).join(' | '))+'</span>':'<span class="ok">הייבוא הסתיים ('+done+' מסמכים). אפשר לחזור לתיק.</span>';
});
</script>
</body>
</html>
