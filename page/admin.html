<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TikChik Management Center</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('mc_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#F4F3FA;--bg2:#EBE9F6;--panel:#FFFFFF;--panel2:#F8F7FD;--line:#E3E0F0;--line2:#D3CFE6;
  --ink:#16142B;--ink2:#4B4766;--muted:#7A7594;
  --acc:#6D28D9;--acc2:#0D9488;--acc-soft:#EDE7FE;--acc2-soft:#DDF5F2;
  --ok:#15803D;--ok-bg:#E3F6EA;--warn:#B45309;--warn-bg:#FDF0DC;--bad:#BE123C;--bad-bg:#FDE4EA;--off:#64748B;--off-bg:#EEF0F4;
  --sh:0 1px 2px rgb(22 20 43/.06),0 4px 16px rgb(22 20 43/.05);--r:16px;
  --c1:#6D28D9;--c2:#0D9488;--c3:#D97706;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0918;--bg2:#100E24;--panel:#14122C;--panel2:#1A1836;--line:#262342;--line2:#34305A;
  --ink:#EEEBFF;--ink2:#B7B2D6;--muted:#8C87AD;
  --acc:#A78BFA;--acc2:#2DD4BF;--acc-soft:#251E4A;--acc2-soft:#0E2E2C;
  --ok:#4ADE80;--ok-bg:#0F2A1C;--warn:#FBBF24;--warn-bg:#2B2210;--bad:#FB7185;--bad-bg:#2E1220;--off:#94A3B8;--off-bg:#1C1B33;
  --sh:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25);--c1:#A78BFA;--c2:#2DD4BF;--c3:#FBBF24}}
:root[data-theme="dark"]{
  --bg:#0A0918;--bg2:#100E24;--panel:#14122C;--panel2:#1A1836;--line:#262342;--line2:#34305A;
  --ink:#EEEBFF;--ink2:#B7B2D6;--muted:#8C87AD;
  --acc:#A78BFA;--acc2:#2DD4BF;--acc-soft:#251E4A;--acc2-soft:#0E2E2C;
  --ok:#4ADE80;--ok-bg:#0F2A1C;--warn:#FBBF24;--warn-bg:#2B2210;--bad:#FB7185;--bad-bg:#2E1220;--off:#94A3B8;--off-bg:#1C1B33;
  --sh:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25);--c1:#A78BFA;--c2:#2DD4BF;--c3:#FBBF24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.main:focus{outline:none}
input[type=number],input[type=text],input[type=date],select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-height:32px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100dvh}
.scrim{position:fixed;inset:0;background:rgb(10 8 30/.45);z-index:39;display:none}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;background:var(--bg2);border-inline-start:1px solid var(--line);padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;border-bottom:1px solid var(--line)}
.brand .mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgb(109 40 217/.35)}
.brand .mk svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:15px;letter-spacing:.2px} .brand span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h4{margin:12px 8px 4px;font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:14px;min-height:38px}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.nav a[aria-current="page"] svg{stroke:var(--acc)}
.nav a.soon{opacity:.55;cursor:default} .nav a.soon:hover{background:none;color:var(--ink2)}
.nav .tag{margin-inline-start:auto;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--off-bg);color:var(--off)}
.nav .dot{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.side .foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:8px} .who .av{width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.who b{color:var(--ink);font-size:13px;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{min-width:0;padding:22px 28px 60px;max-width:1360px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-.2px} .top .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconb.menu-b{display:none}
.iconb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.iconb svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;min-height:32px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#120F2A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#120F2A}}
.custom{display:none;gap:6px;align-items:center} .custom.on{display:inline-flex}
.custom input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:13px;min-height:34px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:36px;color:var(--ink)}
.btn:hover{border-color:var(--acc)} .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#120F2A} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#120F2A}}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px}

/* ---- cards ---- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;min-width:0}
.card h2{margin:0 0 4px;font-size:16px} .card h3{margin:0 0 8px;font-size:14.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kpi{position:relative;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:start;border:1px solid var(--line);background:var(--panel);transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--acc)} .kpi.nogo{cursor:default} .kpi.nogo:hover{border-color:var(--line)}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .v .of{font-size:14px;color:var(--muted);font-weight:600}
.kpi .v.na{font-size:16px;color:var(--muted);font-weight:700}
.kpi .d{font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;align-self:flex-start}
.d.up{background:var(--ok-bg);color:var(--ok)} .d.down{background:var(--bad-bg);color:var(--bad)} .d.same{background:var(--off-bg);color:var(--off)}
.kpi .n{font-size:12.5px;color:var(--ink2)} .kpi .src{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:auto;display:flex;gap:6px;align-items:flex-start}
.kpi .src svg{width:13px;height:13px;flex:none;margin-top:3px;stroke:currentColor;fill:none;stroke-width:2}
.kpi.st-bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:linear-gradient(0deg,var(--panel),var(--panel)),var(--bad-bg)}
.kpi.st-bad::before,.kpi.st-warn::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--bad)} .kpi.st-warn::before{background:var(--warn)}
ul.plain{margin:0;padding:0;list-style:none}ul.plain li{padding:5px 0;border-top:1px solid var(--line,#e5e7eb);font-size:13.5px;line-height:1.45}ul.plain li .pill{margin-inline-end:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .keys{display:flex;flex-direction:column;gap:8px} .krow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px} .kn{display:flex;flex-wrap:wrap;align-items:center;gap:8px} .kn code{font-size:13px;font-weight:700;word-break:break-all} .kw{font-size:13px} .kt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end} .ksub{font-size:12px;color:var(--muted)} @media (max-width:700px){.krow{grid-template-columns:1fr} .kt{justify-content:flex-start}} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-off{background:var(--off-bg);color:var(--off)} .p-acc{background:var(--acc-soft);color:var(--acc)}
.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.banner svg{width:18px;height:18px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;margin-top:2px}
.banner.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)} .banner.warn svg{stroke:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:transparent;color:var(--ink)} .banner.bad svg{stroke:var(--bad)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}} @media (prefers-reduced-motion:reduce){.skel{animation:none}}
.err{padding:16px;border-radius:12px;background:var(--bad-bg);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---- chart ---- */
.chart{position:relative} .chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:Heebo,sans-serif} .chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round} .chart .ar{opacity:.12}
.chart .hv{stroke:var(--line2);stroke-dasharray:3 3} .chart .pt{stroke:var(--panel);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:12.5px;box-shadow:var(--sh);white-space:nowrap;z-index:5;transform:translate(-50%,-110%)}
.tip b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-inline-end:6px;vertical-align:middle}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 60px;gap:10px;align-items:center;font-size:13px}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .bar .tr{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden} .bar .fl{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.bar .nv{text-align:end;font-weight:700}

/* ---- tables ---- */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar input[type=search],.tbar select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13.5px;min-height:38px}
.tbar input[type=search]{flex:1 1 200px;min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--panel2);position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center} th button:focus-visible{outline:2px solid var(--acc)}
th[aria-sort="ascending"] button::after{content:"▲";font-size:9px} th[aria-sort="descending"] button::after{content:"▼";font-size:9px}
tbody tr:last-child td{border-bottom:0} tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel2)}
td.wrap{white-space:normal;min-width:220px}
.u1{display:flex;align-items:center;gap:9px} .u1 .av{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.u1 b{display:block;font-size:13.5px} .u1 span{display:block;color:var(--muted);font-size:12px}

/* ---- profile ---- */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap} .ph .av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;margin-top:6px}
.kv div{font-size:13px} .kv b{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:1px}
.heat{display:flex;gap:3px;flex-wrap:wrap;direction:ltr} .heat i{width:12px;height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.heat i.on{background:var(--acc2);border-color:transparent} .heat i.bf{background:color-mix(in srgb,var(--acc2) 45%,transparent);border-color:transparent}
.checks{display:flex;flex-direction:column;gap:6px} .checks label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px} .checks input{margin-top:4px;accent-color:var(--acc)}
.checks small{color:var(--muted);display:block}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:var(--panel2);margin-top:8px}
.inline input[type=text]{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:34px}
.msg{font-size:13px;margin-top:6px} .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.funnel{display:flex;flex-direction:column;gap:6px} .funnel .st{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.funnel .tr{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden} .funnel .fl{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.chain{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}

@media (max-width:1100px){.row2{grid-template-columns:minmax(0,1fr)}} .row2>*{min-width:0}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 0 0 auto;width:min(300px,86vw);z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 40px rgb(0 0 0/.25)}
  .side.on{transform:none} .scrim.on{display:block}
  .iconb.menu-b{display:grid} .main{padding:14px 16px 60px}
  .top h1{font-size:20px} .kpi .v{font-size:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} .kpis .card{padding:12px} .kpi .l{font-size:12.5px} .kpi .src{font-size:11px}
  .bar{grid-template-columns:minmax(0,1fr) 90px 44px}
  .funnel .st{grid-template-columns:110px minmax(0,1fr) 54px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side" aria-label="ניווט במרכז הניהול">
    <div class="brand"><div class="mk" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg></div><div><b>TikChik</b><span>Management Center</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div class="who" id="who"></div><a href="/" class="btn sm" style="justify-content:center">חזרה לאתר</a></div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="iconb menu-b" id="menuB" aria-label="תפריט" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><h1 id="h1">טוען…</h1><div class="sub" id="sub"></div></div></div>
      <div class="tools" id="tools"><div class="seg" id="range" role="group" aria-label="טווח זמן"></div><span class="custom" id="custom"><input type="date" id="cFrom" aria-label="מתאריך"><span>–</span><input type="date" id="cTo" aria-label="עד תאריך"><button class="btn sm" id="cGo">הצג</button></span>
        <button class="iconb" id="themeB" aria-label="יום / לילה"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></header>
    <div id="view"></div>
  </main>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), view=$('view');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('he-IL'), nf=v=>v==null?'—':NF.format(v), usd=v=>v==null?'—':'$'+(v<10?v.toFixed(2):NF.format(Math.round(v)));
const dmy=s=>{if(!s)return '—'; const d=new Date(s.length===10?s+'T12:00:00':s); return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'})};
const dt=s=>{if(!s)return '—'; const d=new Date(s); return d.toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})};

// a line chart: several series over the days, a crosshair with the values on hover / touch
let LAST_CHART=null;
function lineChart(el,days,series,{h=220}={}){
  const draw=()=>{const W=Math.max(320,el.clientWidth||600), H=h, L=36, Rr=10, T=10, B=26, n=days.length, max=Math.max(1,...series.flatMap(s=>s.v)), step=Math.pow(10,Math.floor(Math.log10(max))), top=Math.ceil(max/step)*step||1;
    // as on the site's own charts: the oldest day on the left, today on the right; the values' scale on the left
    const X=i=>n<2?(L+W-Rr)/2:L+(W-L-Rr)*i/(n-1), Y=v=>T+(H-T-B)*(1-v/top);
    const grid=[0,.25,.5,.75,1].map(f=>{const v=top*f, y=Y(v); return `<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+4}" text-anchor="end">${nf(Math.round(v))}</text>`}).join('');
    const lab=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text class="ax" x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(dmy(days[i]))}</text>`).join('');
    const paths=series.map(s=>{const p=s.v.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(''); return `${s.area?`<path class="ar" style="fill:${s.c}" d="${p}L${X(n-1)},${Y(0)}L${X(0)},${Y(0)}Z"/>`:''}<path class="ln" style="stroke:${s.c}" d="${p}"/>${n<3?s.v.map((v,i)=>`<circle r="4" cx="${X(i)}" cy="${Y(v)}" style="fill:${s.c}"/>`).join(''):''}`}).join('');
    el.innerHTML=`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.l)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.l+': '+s.v.reduce((a,b)=>a+b,0)).join(', '))}">${grid}${lab}${paths}<g id="hv"></g></svg><div class="tip" hidden></div>`;
    const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), hv=svg.querySelector('#hv');
    const at=ev=>{const r=svg.getBoundingClientRect(), x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*W/r.width; let bi=0,bd=1e9; for(let i=0;i<n;i++){const d=Math.abs(X(i)-x); if(d<bd){bd=d;bi=i}} return bi};
    const show=ev=>{const i=at(ev), x=X(i); hv.innerHTML=`<line class="hv" x1="${x}" x2="${x}" y1="${T}" y2="${H-B}"/>`+series.map(s=>`<circle class="pt" r="4.5" cx="${x}" cy="${Y(s.v[i])}" style="fill:${s.c}"/>`).join('');
      tip.hidden=false; tip.innerHTML=`<b>${esc(dmy(days[i]))}</b>${series.map(s=>`${esc(s.l)}: <span class="num">${nf(s.v[i])}</span>`).join('<br>')}`; const r=svg.getBoundingClientRect(); tip.style.left=(x*r.width/W)+'px'; tip.style.top=(Y(Math.max(...series.map(s=>s.v[i])))*r.height/H+svg.offsetTop)+'px'};
    svg.addEventListener('mousemove',show); svg.addEventListener('touchstart',show,{passive:true}); svg.addEventListener('touchmove',show,{passive:true}); svg.addEventListener('mouseleave',()=>{hv.innerHTML=''; tip.hidden=true})};
  draw(); LAST_CHART=draw; return draw}
addEventListener('resize',()=>{clearTimeout(window.__rz); window.__rz=setTimeout(()=>{if(LAST_CHART)LAST_CHART()},150)});
// a sortable, searchable table
function table(el,{cols,rows,search=null,filters=[],onRow=null,empty='אין נתונים'}){
  let q='', sort=null, dir=1, F={};
  const draw=()=>{let L=rows.filter(r=>(!q||(search?search(r):JSON.stringify(r)).toLowerCase().includes(q))&&filters.every(f=>!F[f.k]||String(f.get(r))===F[f.k]));
    if(sort){const c=cols.find(c=>c.k===sort); L=L.slice().sort((a,b)=>{const x=c.sv?c.sv(a):a[c.k], y=c.sv?c.sv(b):b[c.k]; return (x==null)-(y==null)||(x>y?1:x<y?-1:0)*dir})}
    el.querySelector('tbody').innerHTML=L.length?L.map((r,i)=>`<tr${onRow?` class="click" tabindex="0" data-i="${rows.indexOf(r)}"`:''}>${cols.map(c=>`<td class="${c.cls||''}">${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}"><div class="empty">${esc(empty)}</div></td></tr>`;
    el.querySelector('.cnt').textContent=`${L.length} מתוך ${rows.length}`;
    for(const th of el.querySelectorAll('th[data-k]'))th.setAttribute('aria-sort',th.dataset.k===sort?(dir>0?'ascending':'descending'):'none')};
  el.innerHTML=`<div class="tbar">${search?'<input type="search" placeholder="חיפוש…" aria-label="חיפוש בטבלה">':''}${filters.map(f=>`<select data-f="${f.k}" aria-label="${esc(f.l)}"><option value="">${esc(f.l)}: הכל</option>${f.opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`).join('')}<span class="cnt" style="color:var(--muted);font-size:12.5px;margin-inline-start:auto"></span></div>
    <div class="tw"><table><thead><tr>${cols.map(c=>`<th data-k="${c.k}" aria-sort="none">${c.nosort?esc(c.l):`<button type="button">${esc(c.l)}</button>`}</th>`).join('')}</tr></thead><tbody></tbody></table></div>`;
  const s=el.querySelector('input[type=search]'); if(s)s.addEventListener('input',()=>{q=s.value.trim().toLowerCase(); draw()});
  for(const sel of el.querySelectorAll('select[data-f]'))sel.addEventListener('change',()=>{F[sel.dataset.f]=sel.value; draw()});
  el.querySelector('thead').addEventListener('click',e=>{const th=e.target.closest('th[data-k]'); if(!th||!th.querySelector('button'))return; if(sort===th.dataset.k)dir=-dir; else{sort=th.dataset.k; dir=th.dataset.k==='name'?1:-1} draw()});
  if(onRow){const go=e=>{const tr=e.target.closest('tr[data-i]'); if(tr)onRow(rows[+tr.dataset.i])}; el.addEventListener('click',go); el.addEventListener('keydown',e=>{if(e.key==='Enter')go(e)})}
  draw()}

      ${kpi({k:'f',label:'עובדות / פרשנויות / הערכות',value:Q.facts,src:'סיווג הקריאה',note:`${nf(Q.interp)} פרשנויות · ${nf(Q.est)} הערכות`})}</div>
    <section class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2 style="margin:0">התקציר העולמי</h2><button class="btn sm ${B&&!B.unavailable?'':'pri'}" id="wbGo" ${d.keyOff?'disabled':''}>${B&&!B.unavailable?'לכתוב מחדש':'לכתוב תקציר'}</button></div>
      <p class="hint">צ׳יקו קורא את המודל שלמטה וכותב תמונת מצב: ההתפתחויות, האזורים, הענפים, מה צפוי ותרחישים אפשריים. כל מספר נבדק מול המודל. אין תחזית מחיר ואין המלצה.</p><div id="wb">${d.keyOff?banner('חסר ANTHROPIC_API_KEY: התקציר לא זמין. המודל עצמו זמין.','warn'):B?briefH(B):'<div class="empty">עוד לא נכתב תקציר לחלון הזה.</div>'}</div><div class="msg" id="wbM" role="status"></div></section>
    <div class="row2" style="margin-top:14px"><section class="card"><h2>האירועים</h2><p class="hint">אירוע = כמה כתבות על אותו דבר. הסדר: רמה, מספר מקורות, זמן. ° = חברה שמושפעת בעקיפין.</p>${d.events.length?d.events.slice(0,25).map(ev).join(''):'<div class="empty">אין אירועים שנקראו בחלון הזה.</div>'}</section>
      <div><section class="card"><h2>השווקים</h2>${d.markets.length?`<div class="tw"><table><tbody>${d.markets.map(m=>`<tr><td>${esc(m.name)}</td><td class="num">${nf(m.px)}</td><td class="num"><span class="d ${m.chg>0?'up':m.chg<0?'down':'same'}">${m.chg>0?'+':''}${m.chg}%</span></td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:6px">שינוי מהסגירה הקודמת. אין קשר סיבתי לאירועים.</p>`:'<div class="empty">אין נתוני שוק.</div>'}</section>
        <section class="card" style="margin-top:14px"><h2>אזורים</h2>${d.regions.length?`<div class="tw"><table><thead><tr><th>אזור</th><th>אירועים</th><th>קריטי/חשוב</th><th>נטייה</th></tr></thead><tbody>${d.regions.map(r=>`<tr title="${esc(r.top.join(' · '))}"><td>${esc(r.name)}</td><td class="num">${nf(r.n)}</td><td class="num">${nf(r.crit)} / ${nf(r.imp)}</td><td>${r.pos>r.neg?lean('pos'):r.neg>r.pos?lean('neg'):lean(r.pos||r.neg?'mixed':'unclear')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">—</div>'}</section></div></div>
    <div class="row2" style="margin-top:14px"><section class="card"><h2>לחץ על ענפים</h2><p class="hint">כמה אירועים נוגעים לכל ענף ולאן הם נוטים. נטייה היא מהקריאה, לא מדידה של מחיר.</p>${d.sectors.length?`<div class="tw"><table><thead><tr><th>ענף</th><th>אירועים</th><th>חיובי / שלילי</th><th>נטייה</th><th>חברות</th></tr></thead><tbody>${d.sectors.map(s=>`<tr><td>${esc(s.name)}</td><td class="num">${nf(s.n)}</td><td class="num">${nf(s.pos)} / ${nf(s.neg)}</td><td>${lean(s.lean)}</td><td class="mono" style="font-size:12px">${esc(s.companies.map(c=>c.sym).join(' '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">—</div>'}</section>
      <section class="card"><h2>נושאים ומומנטום</h2><p class="hint">כתבות ביממה האחרונה מול הממוצע ליום לפניה בחלון.${WDAYS<2?' בחלון של יממה אין השוואה.':''}</p>${d.themes.length?`<div class="tw"><table><thead><tr><th>נושא</th><th>יממה אחרונה</th><th>ממוצע לפני</th><th></th></tr></thead><tbody>${d.themes.slice(0,15).map(t=>`<tr><td>${esc(t.name)}</td><td class="num">${nf(t.now)}</td><td class="num">${t.base}</td><td>${t.state==='up'?'<span class="d down">▲ מתחזק</span>':t.state==='down'?'<span class="d up">▼ נחלש</span>':'<span class="d same">יציב</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">—</div>'}</section></div>
    <div class="row2" style="margin-top:14px"><section class="card"><h2>מה צפוי (14 יום)</h2><p class="hint">לוח האירועים הכלכלי ודוחות בולטים, ולכל אירוע מאקרו: הנושאים סביבו בחדשות עכשיו. לוח, לא תחזית.</p>${d.ahead.length?`<div class="tw"><table><thead><tr><th>מתי</th><th>מה</th><th>לשים לב</th></tr></thead><tbody>${d.ahead.map(a=>`<tr><td>${esc(dmy(a.d))}${a.est?' <span class="pill p-off">משוער</span>':''}</td><td class="wrap">${esc(a.name)}${a.region?` <span class="hint">${esc(a.region)}</span>`:''}</td><td class="wrap" style="font-size:12.5px">${esc(a.watch||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין אירועים בלוח.</div>'}</section>
      <section class="card"><h2>החברות המוזכרות</h2>${d.companies.length?`<div class="tw"><table><thead><tr><th>חברה</th><th>אירועים</th><th>ישיר</th><th>חיובי / שלילי</th></tr></thead><tbody>${d.companies.map(c=>`<tr><td class="mono">${esc(c.sym)}</td><td class="num">${nf(c.events)}</td><td class="num">${nf(c.direct)}</td><td class="num">${nf(c.pos)} / ${nf(c.neg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">—</div>'}
        <h2 style="margin-top:16px">איכות המקורות</h2><div class="bars">${Q.pubs.map(p=>`<div class="bar"><span class="t">${esc(p.p)}</span><span class="tr"><span class="fl" style="width:${Math.max(2,100*p.n/Q.pubs[0].n)}%;display:block"></span></span><span class="nv num">${nf(p.n)}</span></div>`).join('')}</div></section></div>`;
  for(const b of view.querySelectorAll('[data-wd]'))b.onclick=()=>{WDAYS=+b.dataset.wd; route()};
  if($('wbGo'))$('wbGo').onclick=async()=>{$('wbGo').disabled=true; $('wbM').className='msg'; $('wbM').textContent='צ׳יקו קורא את המודל וכותב…';
    try{const r=await api('world/brief',{method:'POST',body:JSON.stringify({days:WDAYS,force:true})}); $('wb').innerHTML=r.unavailable?banner(esc(r.unavailable),'warn'):briefH(r); $('wbM').textContent=''}catch(e){$('wbM').className='msg bad'; $('wbM').textContent=e.message} $('wbGo').disabled=false}};
const REG={us:'ארה״ב',israel:'ישראל',europe:'אירופה',uk:'בריטניה',china:'סין',japan:'יפן',india:'הודו',russia:'רוסיה',ukraine:'אוקראינה',middle_east:'המזרח התיכון',latam:'אמריקה הלטינית',asia:'אסיה',global:'עולמי'};
const TH={rates:'ריבית',inflation:'אינפלציה',usd:'הדולר',oil:'נפט',gas:'גז',chips:'שבבים',ai:'בינה מלאכותית',war:'מלחמה',sanctions:'סנקציות',tariffs:'מכסים',china:'סין',israel:'ישראל',europe:'אירופה',supply:'שרשרת אספקה',regulation:'רגולציה',banks:'בנקים',consumer:'צריכה פרטית',housing:'דיור',crypto:'קריפטו',gold:'זהב',jobs:'תעסוקה',growth:'צמיחה',metals:'מתכות',uranium:'אורניום',power:'חשמל',defense:'ביטחון',shipping:'ספנות',fed:'הפד',ecb:'הבנק המרכזי האירופי',boi:'בנק ישראל'};
const SECH={Technology:'טכנולוגיה',Finance:'פיננסים','Health Care':'בריאות','Consumer Discretionary':'צריכה','Consumer Staples':'מוצרי יסוד',Industrials:'תעשייה',Energy:'אנרגיה',Utilities:'תשתיות','Real Estate':'נדל״ן','Basic Materials':'חומרי גלם',Telecommunications:'תקשורת',Defense:'ביטחון',Semiconductors:'שבבים',Retail:'קמעונאות',Automotive:'רכב',Transportation:'תחבורה'};
function briefH(B){if(B.unavailable)return banner(esc(B.unavailable),'warn'); const SURE={fact:['p-ok','עובדה'],interp:['p-warn','פרשנות'],est:['p-acc','הערכה']}, LK={low:['p-off','סבירות נמוכה'],mid:['p-warn','סבירות בינונית'],high:['p-bad','סבירות גבוהה']};
  return `<p style="font-size:16px;font-weight:700;margin:4px 0 12px;line-height:1.6">${esc(B.headline)}</p>
    ${B.developments.length?`<h3 style="font-size:13px;color:var(--muted);margin:0 0 6px">ההתפתחויות</h3><ol style="margin:0;padding-inline-start:20px">${B.developments.map(x=>`<li style="margin:6px 0"><b>${esc(x.t)}</b> <span class="pill ${SURE[x.sure][0]}">${SURE[x.sure][1]}</span><div style="font-size:13px;color:var(--ink2)">${esc(x.why)}</div>${x.ev.length?`<div style="font-size:11.5px;color:var(--muted)">על סמך: ${x.ev.map(i=>esc((B.evTitles||[])[i]||'#'+i)).join(' · ')}</div>`:''}</li>`).join('')}</ol>`:''}
    <div class="row2" style="margin-top:12px">${B.regions.length?`<div><h3 style="font-size:13px;color:var(--muted);margin:0 0 6px">אזורים</h3>${B.regions.map(r=>`<p style="margin:4px 0;font-size:13.5px"><b>${esc(r.r)}:</b> ${esc(r.t)}</p>`).join('')}</div>`:''}
      ${B.sectors.length?`<div><h3 style="font-size:13px;color:var(--muted);margin:0 0 6px">ענפים</h3>${B.sectors.map(x=>`<p style="margin:4px 0;font-size:13.5px"><span class="pill ${DIRH[x.lean][0]}">${DIRH[x.lean][1]}</span> <b>${esc(x.s)}:</b> ${esc(x.why)}</p>`).join('')}</div>`:''}</div>
    ${B.ahead.length?`<h3 style="font-size:13px;color:var(--muted);margin:12px 0 6px">מה צפוי</h3><ul style="margin:0;padding-inline-start:18px">${B.ahead.map(a=>`<li style="margin:4px 0;font-size:13.5px"><b>${esc(a.d)}</b> ${esc(a.t)}${a.watch?` <span style="color:var(--ink2)">· ${esc(a.watch)}</span>`:''}</li>`).join('')}</ul>`:''}
    ${B.scenarios.length?`<h3 style="font-size:13px;color:var(--muted);margin:12px 0 6px">תרחישים אפשריים (לא תחזית)</h3>${B.scenarios.map(c=>`<div class="inline" style="display:block"><b>אם</b> ${esc(c.if)} <b>אז</b> ${esc(c.then)} <span class="pill ${LK[c.likely][0]}">${LK[c.likely][1]}</span><div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(c.why)}</div></div>`).join('')}`:''}
    ${B.limits?`<p class="hint" style="margin-top:10px"><b>מגבלות:</b> ${esc(B.limits)}</p>`:''}
    <p style="font-size:12px;margin:8px 0 0" class="${B.check&&B.check.ok?'':'msg bad'}">${B.check?(B.check.ok?'✓ ':'⚠ ')+esc(B.check.note)+(B.check.unknown&&B.check.unknown.length?' ('+esc(B.check.unknown.join(', '))+')':''):''}</p><p class="hint" style="margin:4px 0 0">${esc(dt(B.at))}${B.cached?' · מהשעה האחרונה':''} · ${esc(B.model||'')}</p>`}

// ---- roles and permissions ----
SCREENS.access=async()=>{head('תפקידים והרשאות','מי יכול לעשות מה במרכז הניהול. ההרשאות נאכפות בשרת, לא רק בתצוגה.'); view.innerHTML=loading(3);
  const d=await api('users'); const P=['view','edit','users','system','sensitive'], L={view:'צפייה',edit:'עריכה',users:'משתמשים',system:'מערכת',sensitive:'מידע רגיש'};
  view.innerHTML=`${banner('<b>ברירות מחדל:</b> בעלים — הכל. מנהל — צפייה, עריכה, משתמשים, מערכת (בלי מידע רגיש). שותף — כלום. רק בעל המערכת נותן "ניהול משתמשים" ו"מידע רגיש"; אף אחד לא משנה את ההרשאות של עצמו או של בעל המערכת. כל שינוי נרשם ביומן.')}
    <section class="card" id="tblR"></section>
    <section class="card" style="margin-top:14px"><h2>מה כל הרשאה מאפשרת</h2><div class="tw"><table><tbody>
      <tr><td><b>צפייה</b></td><td class="wrap">כניסה למרכז הניהול: תמונת מצב, משתמשים (בלי מידע רגיש), מודיעין מוצר, תקינות, יומן פעולות הניהול.</td></tr>
      <tr><td><b>עריכה</b></td><td class="wrap">הגדרות של מרכז הניהול (מחירי מודלי ה-AI), ובהמשך תוכן והודעות.</td></tr>
      <tr><td><b>משתמשים</b></td><td class="wrap">השעיה והחזרה, שינוי תפקיד והרשאות של משתמשים אחרים.</td></tr>
      <tr><td><b>מערכת</b></td><td class="wrap">הרצת משימות מתוזמנות עכשיו.</td></tr>
      <tr><td><b>מידע רגיש</b></td><td class="wrap">יומן הכניסות (עם רשת מקוצרת). כל צפייה נרשמת ביומן. תוכן תיקי השקעות לא זמין גם בהרשאה הזו.</td></tr></tbody></table></div></section>`;
  table($('tblR'),{rows:d.users,search:u=>u.email+' '+u.name,filters:[{k:'role',l:'תפקיד',get:u=>u.role,opts:Object.entries(ROLE)}],
    cols:[{k:'name',l:'משתמש',sv:u=>(u.name||u.email).toLowerCase(),f:u=>`<div class="u1"><span class="av">${ini(u.name||u.email)}</span><div><b>${esc(u.name||u.email.split('@')[0])}</b><span class="mono">${esc(u.email)}</span></div></div>`},
      {k:'role',l:'תפקיד',f:u=>ROLE[u.role]||esc(u.role)},...P.map(p=>({k:'p_'+p,l:L[p],sv:u=>u.effective.includes(p)?1:0,f:u=>u.effective.includes(p)?'<span class="pill p-ok">✓</span>':'<span style="color:var(--muted)">—</span>'})),
      {k:'src',l:'מקור',f:u=>u.role==='owner'?'בעלים':u.perms?'מותאם':'לפי התפקיד'}],onRow:u=>location.hash='#user/'+u.id})};

// ================= routing =================
async function route(){const h=(location.hash||'#exec').slice(1), [id,arg]=h.split('/'); menuOpen(false);
  const known=SCREENS[id]?id:'exec'; navRender(id==='user'?'users':id==='ticket'?'support':known); LAST_CHART=null;
  try{await SCREENS[known](arg?decodeURIComponent(arg):undefined)}catch(e){view.innerHTML=errBox(e,known)}
  $('main').focus({preventScroll:true}); scrollTo(0,0)}
addEventListener('hashchange',route);
(async()=>{try{const m=await api('me'); ME=m.me; PERMS=m.me.perms; K=m.k;
    $('who').innerHTML=`<span class="av">${ini(ME.name||ME.email)}</span><div><b>${esc(ME.name||ME.email)}</b>${esc(ROLE[ME.role]||ME.role)}</div>`;
    route()}catch(e){view.innerHTML=errBox(e,'exec'); $('h1').textContent='TikChik Management Center'}})();
})();
</script>
